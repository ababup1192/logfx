# tag を打った時だけ、flix doc のリファレンスを GitHub Pages に置く。
#
# WhyNot: main への push ごとに公開しない。リファレンスは「今 flix.toml に書ける版」の
# API でないと意味が無く、main の途中の状態を出すと、利用者が入れている版と読んでいる
# ページがずれる。ずれている事は読んでいる側から見えない。
name: pages

on:
  push:
    tags: ["v*"]
  # 公開に失敗した時に、tag を打ち直さずに回せる口。
  workflow_dispatch:

# WhyNot: 既定の read-all のままにしない。Pages への deploy は id-token（OIDC）で
# 認証するので、この 2 つが無いと deploy の step だけが落ちる。
permissions:
  contents: read
  pages: write
  id-token: write

# WhyNot: 同時に走らせない。Pages の deploy は 1 つの環境を上書きするので、
# 重なると後から始まった方が古い方に負ける事がある。
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FLIX_NO_LOCK: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - id: flix
        run: echo "version=$(sed -n 's/^flix *= *\"\(.*\)\"/\1/p' flix.toml)" >> "$GITHUB_OUTPUT"
      - name: Flix のコンパイラ
        run: curl -sSL --fail -o /tmp/flix.jar https://github.com/flix/flix/releases/download/v${{ steps.flix.outputs.version }}/flix.jar
      - name: リファレンスを作る
        run: make doc
        env:
          FLIX_JAR: /tmp/flix.jar
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
