# Puts the flix doc reference on GitHub Pages, and only on a tag.
#
# WhyNot: not published on every push to main. A reference is only worth reading if it is the API
# of a version you can actually write in flix.toml; publishing from the middle of main makes the
# page drift from the version the reader installed, and the drift is invisible to them.
name: pages

on:
  push:
    tags: ["v*"]
  # A way to run this again after a failed publish, without cutting another tag.
  workflow_dispatch:

# WhyNot: not left at the default read-all. Deploying to Pages authenticates with an id-token
# (OIDC), so without these two the deploy step alone fails.
permissions:
  contents: read
  pages: write
  id-token: write

# WhyNot: not run concurrently. A Pages deploy overwrites one environment, so when two overlap
# the one that started later can lose to the older one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - id: flix
        run: echo "version=$(sed -n 's/^flix *= *\"\(.*\)\"/\1/p' flix.toml)" >> "$GITHUB_OUTPUT"
      - name: The Flix compiler
        run: curl -sSL --fail -o /tmp/flix.jar https://github.com/flix/flix/releases/download/v${{ steps.flix.outputs.version }}/flix.jar
      - name: Build the reference
        run: make doc
        env:
          FLIX_JAR: /tmp/flix.jar
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
