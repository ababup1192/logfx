# On every push: type check, tests, and whether a blank project can pull the package in.
# The Flix compiler jar comes from its release and is handed to bin/flix through FLIX_JAR.
name: ci

on:
  push:
  pull_request:

env:
  # Flix calls the GitHub API to resolve a github: dependency. Without authentication the runners'
  # shared IP hits the rate limit, so every job gets a token (bin/flix picks it up).
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # WhyNot: bin/with-lock is not used in CI. /usr/bin/shlock is a BSD (macOS) tool and is absent
  # on the ubuntu runners. It exists to stop two compilers overlapping on one machine, which a CI
  # that runs one job at a time does not need.
  FLIX_NO_LOCK: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # WhyNot: not folded into a later step. It needs no compiler, so it answers in a second and
      # says which line to fix before the three-minute type check starts.
      - name: Wording
        run: make check-jargon
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # WhyNot: the version is not written in this file. Drifting from flix = "..." in flix.toml
      # would mean a different compiler locally and in CI, and a green CI would guarantee nothing.
      - id: flix
        run: echo "version=$(sed -n 's/^flix *= *\"\(.*\)\"/\1/p' flix.toml)" >> "$GITHUB_OUTPUT"
      - name: The Flix compiler
        run: curl -sSL --fail -o /tmp/flix.jar https://github.com/flix/flix/releases/download/v${{ steps.flix.outputs.version }}/flix.jar
      - run: make check
        env:
          FLIX_JAR: /tmp/flix.jar
      - run: make test
        env:
          FLIX_JAR: /tmp/flix.jar

  # Seen from the calling side. Passing its own test suite and being installable as a package
  # are different things.
  consume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - id: flix
        run: echo "version=$(sed -n 's/^flix *= *\"\(.*\)\"/\1/p' flix.toml)" >> "$GITHUB_OUTPUT"
      - name: The Flix compiler
        run: curl -sSL --fail -o /tmp/flix.jar https://github.com/flix/flix/releases/download/v${{ steps.flix.outputs.version }}/flix.jar
      - name: Pull in the .fpkg built from the current source
        run: ci/consume.sh local
        env:
          FLIX_JAR: /tmp/flix.jar
      # WhyNot: examples is not a separate job from consume. Both start by building the .fpkg,
      # so splitting them would only build the same thing twice.
      - name: Build and run the examples
        run: make examples
        env:
          FLIX_JAR: /tmp/flix.jar

  # Only after a tag. Checks the .fpkg on the release through Flix's own dependency resolution
  # (unlike local, what comes down from GitHub and the security setting are actually used).
  consume-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [check, consume]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - id: flix
        run: echo "version=$(sed -n 's/^flix *= *\"\(.*\)\"/\1/p' flix.toml)" >> "$GITHUB_OUTPUT"
      - name: The Flix compiler
        run: curl -sSL --fail -o /tmp/flix.jar https://github.com/flix/flix/releases/download/v${{ steps.flix.outputs.version }}/flix.jar
      - name: Pull in the .fpkg from the release
        run: ci/consume.sh release
        env:
          FLIX_JAR: /tmp/flix.jar
